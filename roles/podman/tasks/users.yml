---
- name: Ubuntu | Read passwd database
  getent:
    database: passwd

- name: Ubuntu | Reset podman user list
  set_fact:
    __podman_users: []

- name: Ubuntu | Collect podman users
  set_fact:
    __podman_users: "{{ __podman_users + [{'name': item.key, 'uid': item.value[1] | int, 'home': item.value[4]}] }}"
  loop: "{{ ansible_facts.getent_passwd | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: >-
    (podman_users | length > 0 and item.key in podman_users) or
    (podman_users | length == 0 and
     item.value[1] | int >= 1000 and item.value[1] | int < 60000 and
     not (item.value[5] is search('(nologin|false)$')))

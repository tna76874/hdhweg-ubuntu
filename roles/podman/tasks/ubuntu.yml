---
# Ubuntu: Ubuntu-Podman als Basis (Hilfsprogramme, AppArmor-Profil, Konfiguration)
# + aktuelles podman-static in /usr/local. Ein alter Stand (Kubic-Repo,
# Pakete mit Epoche 100:, kaputtes podman-static) wird vorher bereinigt.

- name: Ubuntu | Determine podman users
  include_tasks: users.yml

- name: Ubuntu | Detect and repair legacy podman installation
  include_tasks: legacy_cleanup.yml

- name: Ubuntu | Install podman suite of tools (Ubuntu archive as base)
  become: true
  become_user: root
  apt:
    name: "{{ podman_tools + podman_ubuntu_base_packages }}"
    state: present
    update_cache: yes

- name: Ubuntu | Install current podman-static
  include_tasks: podman_static.yml

# Ubuntu-crun/conmon (/usr/bin) würden sonst vor /usr/local gefunden werden
- name: Ubuntu | Ensure /etc/containers/containers.conf.d exists
  become: true
  become_user: root
  file:
    path: "{{ podman_runtime_conf | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: podman_force_static_runtime | bool

- name: Ubuntu | Prefer crun/conmon from podman-static
  become: true
  become_user: root
  template:
    src: containers-runtime.conf.j2
    dest: "{{ podman_runtime_conf }}"
    owner: root
    group: root
    mode: "0644"
  register: __podman_runtime_conf
  when: podman_force_static_runtime | bool

- name: Ubuntu | Remove runtime drop-in (disabled)
  become: true
  become_user: root
  file:
    path: "{{ podman_runtime_conf }}"
    state: absent
  register: __podman_runtime_conf_removed
  when: not (podman_force_static_runtime | bool)

- name: Ubuntu | Apply AppArmor podman profile to /usr/local/bin/podman too
  become: true
  become_user: root
  replace:
    path: /etc/apparmor.d/podman
    regexp: '^profile podman /usr/bin/podman '
    replace: 'profile podman /usr/{bin,local/bin}/podman '
  register: __podman_apparmor
  failed_when: false

- name: Ubuntu | Reload AppArmor podman profile
  become: true
  become_user: root
  command: apparmor_parser -r /etc/apparmor.d/podman
  when: __podman_apparmor is changed

- name: Ubuntu | Ensure subuid/subgid ranges for rootless podman
  include_tasks: subids.yml
  loop: "{{ __podman_users }}"
  loop_control:
    loop_var: __podman_user
    label: "{{ __podman_user.name }}"

- name: Ubuntu | Migrate rootless podman of users to the new version
  become: true
  become_user: root
  command:
    argv:
      - runuser
      - -u
      - "{{ item.name }}"
      - --
      - env
      - "HOME={{ item.home }}"
      - "XDG_RUNTIME_DIR=/run/user/{{ item.uid }}"
      - "{{ podman_binary }}"
      - system
      - migrate
  loop: "{{ __podman_users }}"
  loop_control:
    label: "{{ item.name }}"
  when: >-
    (__podman_static_installed | default(false) | bool) or
    (__podman_legacy | default(false) | bool) or
    (__podman_runtime_conf is changed) or
    (__podman_runtime_conf_removed is changed)
  changed_when: false
  failed_when: false

### Prüfen

- name: Ubuntu | Check fusermount3
  stat:
    path: /usr/bin/fusermount3
  register: __podman_fusermount

- name: Ubuntu | Warn if fusermount3 is not setuid
  debug:
    msg: "WARNUNG: /usr/bin/fusermount3 fehlt oder hat kein setuid-Bit – FUSE-Apps (Cryptomator) könnten scheitern!"
  when: not (__podman_fusermount.stat.exists and __podman_fusermount.stat.isuid)

- name: Ubuntu | Check podman version
  command: "{{ podman_binary }} --version"
  register: __podman_version_check
  changed_when: false
  check_mode: false
  failed_when: __podman_version_check.rc != 0 and not ansible_check_mode

- name: Ubuntu | Show podman version
  debug:
    msg: "{{ __podman_version_check.stdout | default('', true) or '(nicht installiert – Check-Modus)' }} ({{ podman_binary }})"

- name: Ubuntu | Check OCI runtime and conmon used by podman
  become: true
  become_user: root
  command: "{{ podman_binary }} info --format {% raw %}'{{.Host.OCIRuntime.Path}} {{.Host.Conmon.Path}}'{% endraw %}"
  register: __podman_runtime_check
  changed_when: false
  check_mode: false
  failed_when: false

- name: Ubuntu | Show OCI runtime and conmon
  debug:
    msg: "OCI-Runtime / conmon: {{ __podman_runtime_check.stdout | default('?', true) }}"

- name: Ubuntu | Warn if podman still uses the Ubuntu crun
  debug:
    msg: >-
      WARNUNG: podman nutzt weiterhin {{ __podman_runtime_check.stdout.split() | first }}
      statt {{ podman_static_prefix }}/bin/crun. Benutzer-Overrides in
      ~/.config/containers/containers.conf prüfen!
  when:
    - podman_force_static_runtime | bool
    - __podman_runtime_check.rc == 0
    - not (__podman_runtime_check.stdout | regex_search('^' ~ podman_static_prefix ~ '/'))
